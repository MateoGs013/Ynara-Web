server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Assets con hash de Next: cache larga e inmutable.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # URLs limpias: /presentacion -> presentacion.html, /lab/field -> lab/field.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
